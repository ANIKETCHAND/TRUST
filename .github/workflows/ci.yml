name: AgentTrust Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "main", "redesign/industrial-platform" ]
  pull_request:
    branches: [ "main", "redesign/industrial-platform" ]

jobs:
  backend-test-and-security:
    name: Backend Test Suite & Migration Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install scikit-learn

      - name: Run Alembic Schema Verification
        env:
          PYTHONPATH: backend
        run: |
          python -m alembic -c backend/alembic.ini check

      - name: Execute Pytest Suite (Unit, Integration & Negative Security)
        env:
          PYTHONPATH: backend
          ENVIRONMENT: testing
          DATABASE_URL: sqlite+aiosqlite:///./test_agenttrust.db
          SANDBOX_STORAGE_PATH: ./test_sandbox_storage
        run: |
          pytest -v --durations=10

  frontend-build:
    name: Frontend Build & Asset Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Compile TypeScript & Build Production Bundle
        working-directory: ./frontend
        run: npm run build
